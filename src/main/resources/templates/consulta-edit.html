<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editar consulta</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><main class="content standalone"><a class="secondary" th:href="@{/admin/dashboard#consultas}">← Volver al panel</a><section class="panel"><p class="eyebrow">AGENDA</p><h1>Editar consulta</h1><form class="form-grid" th:action="@{/admin/consultas/{id}/editar(id=${consulta.id})}" method="post"><select name="pacienteId" required><option th:each="p:${pacientes}" th:value="${p.id}" th:selected="${p.id==consulta.paciente.id}" th:text="${p.nombre}"></option></select><input name="motivo" maxlength="100" required th:value="${consulta.motivo}"><input name="consultorio" type="number" min="1" required th:value="${consulta.consultorio}"><input name="horaInicio" type="time" required th:value="${consulta.horaInicio}"><input name="horaFin" type="time" required th:value="${consulta.horaFin}"><select name="medicoId" required><option th:each="d:${medicos}" th:value="${d.id}" th:selected="${d.id==consulta.medico.id}" th:text="${d.nombre+' · '+d.especialidad}"></option></select><button class="primary">Guardar cambios</button></form></section></main></body></html>
