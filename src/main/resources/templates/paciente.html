<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mis citas</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">+</span> Consulta<span class="accent">+</span></div><p class="eyebrow">PORTAL PACIENTE</p><a href="#citas">Mis citas</a><form th:action="@{/logout}" method="post"><button class="logout">Cerrar sesión</button></form></aside><main class="content"><header class="topbar"><div><p class="eyebrow">BIENVENIDO/A</p><h1 th:text="${paciente.nombre}">Paciente</h1><p class="muted">Consulta aquí tus citas y actualiza sus horarios.</p></div><span class="user-pill">Paciente</span></header><section id="citas" class="panel"><div class="section-head"><div><p class="eyebrow">AGENDA PERSONAL</p><h2>Mis citas</h2></div></div><div class="notice" th:if="${success}" th:text="${success}"></div><div class="table-wrap"><table><thead><tr><th>Médico</th><th>Motivo</th><th>Consultorio</th><th>Horario</th><th>Actualizar horario</th></tr></thead><tbody><tr th:each="c:${consultas}"><td><strong th:text="${c.medico.nombre}"></strong><small class="block" th:text="${c.medico.especialidad}"></small></td><td th:text="${c.motivo}"></td><td th:text="${c.consultorio}"></td><td><span th:text="${c.horaInicio}"></span> – <span th:text="${c.horaFin}"></span></td><td><form class="time-form" th:action="@{/paciente/consultas/{id}/horario(id=${c.id})}" method="post"><input type="time" name="horaInicio" th:value="${c.horaInicio}" required><input type="time" name="horaFin" th:value="${c.horaFin}" required><button class="secondary">Guardar</button></form></td></tr><tr th:if="${#lists.isEmpty(consultas)}"><td colspan="5" class="empty">No tienes citas registradas.</td></tr></tbody></table></div></section></main></body></html>
