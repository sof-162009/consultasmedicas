<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso | Consulta+</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="login-page"><main class="login-card"><div class="brand-mark">+</div><p class="eyebrow">CONSULTA MÉDICA</p><h1>Bienvenido</h1><p class="muted">Ingresa con tu cuenta para continuar.</p><div class="notice error" th:if="${param.error}">Usuario o contraseña incorrectos.</div><div class="notice" th:if="${param.logout}">Sesión cerrada correctamente.</div><form th:action="@{/login}" method="post"><label>Usuario<input name="username" autocomplete="username" required maxlength="50"></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary wide">Iniciar sesión</button></form><small>Plataforma de gestión segura de consultas</small></main></body></html>
