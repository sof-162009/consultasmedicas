<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agenda médica</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body><aside class="sidebar"><div class="brand"><span class="brand-mark">+</span> Consulta<span class="accent">+</span></div><p class="eyebrow">PORTAL MÉDICO</p><a href="#agenda">Mi agenda</a><form th:action="@{/logout}" method="post"><button class="logout">Cerrar sesión</button></form></aside><main class="content"><header class="topbar"><div><p class="eyebrow">BIENVENIDO/A</p><h1 th:text="${medico.nombre}">Médico</h1><p class="muted" th:text="${medico.especialidad}"></p></div><span class="user-pill">Médico</span></header><section class="stats"><article class="stat"><span>Consultas asignadas</span><strong th:text="${#lists.size(consultas)}">0</strong></article></section><section id="agenda" class="panel"><div class="section-head"><div><p class="eyebrow">AGENDA PERSONAL</p><h2>Mis consultas</h2></div></div><div class="table-wrap"><table><thead><tr><th>Paciente</th><th>Motivo</th><th>Consultorio</th><th>Horario</th></tr></thead><tbody><tr th:each="c:${consultas}"><td th:text="${c.paciente.nombre}"></td><td th:text="${c.motivo}"></td><td th:text="${c.consultorio}"></td><td><span th:text="${c.horaInicio}"></span> – <span th:text="${c.horaFin}"></span></td></tr><tr th:if="${#lists.isEmpty(consultas)}"><td colspan="4" class="empty">No tienes consultas asignadas.</td></tr></tbody></table></div></section></main></body></html>
